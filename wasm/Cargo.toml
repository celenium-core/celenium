[package]
name = "celenium-wasm"
description = "Celenium WASM bindings"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
repository.workspace = true
# wasm-pack requires this value to be a string
# (it can not be derived from the workspace)
license = "ISC"

[lib]
crate-type = ["cdylib"]

[dependencies]
cfg-if.workspace = true
js-sys.workspace = true
celenium-addresses.workspace = true
celenium-bip32.workspace = true
celenium-consensus-core.workspace = true
celenium-consensus-wasm.workspace = true
celenium-core.workspace = true
celenium-math = { workspace = true, features = ["std"] }
celenium-pow.workspace = true
celenium-txscript.workspace = true
celenium-txscript-zk-sdk.workspace = true
celenium-rpc-core.workspace = true
celenium-utils.workspace = true
celenium-wasm-core.workspace = true
celenium-wallet-core.workspace = true
celenium-wallet-keys.workspace = true
celenium-wrpc-client.workspace = true
celenium-wrpc-wasm.workspace = true
num.workspace = true
wasm-bindgen.workspace = true
workflow-log.workspace = true
workflow-core.workspace = true
workflow-wasm.workspace = true

[features]
wasm32-sdk = [
    "celenium-wallet-core/wasm32-sdk",
    "celenium-pow/wasm32-sdk",
    "celenium-txscript/wasm32-sdk",
    "celenium-txscript-zk-sdk/wasm32-sdk",
]
wasm32-core = [
    "celenium-wallet-core/wasm32-core",
    "celenium-pow/wasm32-sdk",
    "celenium-txscript/wasm32-sdk",
    "celenium-txscript-zk-sdk/wasm32-core",
]
wasm32-rpc = [
    "celenium-consensus-core/wasm32-sdk",
    "celenium-consensus-wasm/wasm32-sdk",
    "celenium-wrpc-client/wasm32-sdk",
    "celenium-wrpc-wasm/wasm32-sdk",
]
wasm32-keygen = []
default = []

[package.metadata.docs.rs]
targets = ["wasm32-unknown-unknown"]

[package.metadata.emanate.wasm]
targets = [
    { target = "nodejs", out-dir = "nodejs/celenium" },
    { target = "web", out-dir = "web/celenium" },
]
folder = "setup"

[package.metadata.wasm-pack.profile.release]
# The wasm is built as W3C MVP + reference-types (see the workspace
# .cargo/config.toml wasm32 rustflags); reference-types is required by
# wasm-bindgen's externref table, which `--weak-refs` relies on. wasm-opt must
# be told to allow reference-types (and bulk-memory, which -O may introduce)
# rather than validating against the MVP-only feature set.
wasm-opt = ["-O","--enable-bulk-memory","--enable-reference-types"]

[lints]
workspace = true
