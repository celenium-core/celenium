[package]
name = "celenium-wrpc-wasm"
description = "Celenium wRPC WASM client"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[features]
wasm32-sdk = ["celenium-wrpc-client/wasm32-sdk"]
default = []

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
ahash.workspace = true
async-lock.workspace = true
cfg-if.workspace = true
celenium-addresses.workspace = true
celenium-consensus-core.workspace = true
celenium-consensus-client.workspace = true
celenium-consensus-wasm.workspace = true
celenium-notify.workspace = true
celenium-wrpc-client.workspace = true
celenium-rpc-core.workspace = true
celenium-rpc-macros.workspace = true
celenium-wasm-core.workspace = true
serde_json.workspace = true
serde-wasm-bindgen.workspace = true
serde.workspace = true
workflow-log.workspace = true
workflow-rpc.workspace = true
workflow-wasm.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
wasm-bindgen-futures.workspace = true
workflow-core.workspace = true
futures.workspace = true
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_03 = { workspace = true, features = ["wasm_js"] }

[lints]
workspace = true
