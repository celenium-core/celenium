[package]
name = "celenium-txscript-zk-sdk"
description = "Celenium txscript ZK SDK"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[features]
wasm32-core = [
    "dep:borsh",
    "dep:js-sys",
    "dep:celenium-wasm-core",
    "dep:wasm-bindgen",
    "dep:workflow-wasm",
    "celenium-txscript/wasm32-sdk",
]
wasm32-sdk = ["wasm32-core"]
default = []

[dependencies]
ark-bn254.workspace = true
ark-ec.workspace = true
ark-groth16.workspace = true
ark-serialize.workspace = true
borsh = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
celenium-txscript.workspace = true
celenium-wasm-core = { workspace = true, optional = true }
risc0-binfmt.workspace = true
risc0-groth16.workspace = true
risc0-zkvm.workspace = true
sha2.workspace = true
thiserror.workspace = true
wasm-bindgen = { workspace = true, optional = true }
workflow-wasm = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_03 = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
bincode.workspace = true
borsh.workspace = true
celenium-consensus-core.workspace = true
celenium-hashes.workspace = true
celenium-txscript-errors.workspace = true

[lints]
workspace = true
