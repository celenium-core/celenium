[package]
name = "celenium-txscript"
description = "Celenium txscript engine library"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[[example]]
name = "kip-10"

[[example]]
name = "verify_premine_multisig"

[[example]]
name = "gen_premine_cltv"

[features]
wasm32-core = ["dep:js-sys", "dep:celenium-wasm-core"]
wasm32-sdk = ["wasm32-core", "celenium-consensus-core/wasm32-sdk"]

[dependencies]
ark-bn254.workspace = true
ark-ec.workspace = true
ark-groth16.workspace = true
ark-relations.workspace = true
ark-serialize.workspace = true
ark-snark.workspace = true
blake2b_simd.workspace = true
blake3.workspace = true
borsh.workspace = true
cfg-if.workspace = true
faster-hex.workspace = true
hexplay.workspace = true
indexmap.workspace = true
itertools.workspace = true
js-sys = { workspace = true, optional = true }
celenium-addresses.workspace = true
celenium-consensus-core.workspace = true
celenium-hashes.workspace = true
celenium-txscript-errors = { workspace = true, features = ["std"] }
celenium-utils.workspace = true
celenium-wasm-core = { workspace = true, optional = true }
log.workspace = true
parking_lot.workspace = true
rand.workspace = true
risc0-binfmt.workspace = true
risc0-circuit-recursion.workspace = true
risc0-core.workspace = true
risc0-zkp.workspace = true
secp256k1 = { workspace = true, features = ["std", "global-context", "rand-std", "serde"] }
serde-wasm-bindgen.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smallvec.workspace = true
thiserror.workspace = true
wasm-bindgen.workspace = true
workflow-wasm.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_03 = { workspace = true, features = ["wasm_js"] }

# Pull risc0-zkvm-platform directly with `export-syscalls` so it defines its
# host stubs (e.g. sys_alloc_aligned as `unimplemented!()`); otherwise the symbol
# is left `extern "C"` (provided only by the zkVM runtime) and undefined on the
# host. Unix linkers tolerate that, but MSVC link.exe rejects it when building a
# cdylib (LNK2019), breaking every Windows cdylib that depends on celenium-txscript.
# Celenium only verifies on the host, so the stub is never actually called.
[target.'cfg(windows)'.dependencies]
risc0-zkvm-platform = { workspace = true, features = ["export-syscalls"] }

[dev-dependencies]
bytemuck.workspace = true
chrono.workspace = true
criterion.workspace = true
rayon.workspace = true
celenium-core.workspace = true
serde_json.workspace = true
smallvec.workspace = true
wasm-bindgen-test.workspace = true

[[bench]]
name = "zk_precompiles"
path = "benches/zk_precompiles.rs"
harness = false

[[bench]]
name = "pricing"
path = "benches/pricing.rs"
harness = false

[lints]
workspace = true
