[package]
name = "celenium-consensus"
description = "Celenium consensus library"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arc-swap.workspace = true
async-channel.workspace = true
bincode.workspace = true
crossbeam-channel.workspace = true
faster-hex.workspace = true
futures-util.workspace = true
hashbrown.workspace = true
indexmap.workspace = true
itertools.workspace = true
celenium-addresses.workspace = true
celenium-consensus-core.workspace = true
celenium-consensus-notify.workspace = true
celenium-consensusmanager.workspace = true
celenium-core.workspace = true
celenium-database.workspace = true
celenium-hashes.workspace = true
celenium-math = { workspace = true, features = ["std"] }
celenium-merkle.workspace = true
celenium-muhash = { workspace = true, features = ["std"] }
celenium-notify.workspace = true
celenium-pow.workspace = true
celenium-seq-commit.workspace = true
celenium-smt.workspace = true
celenium-smt-store.workspace = true
celenium-txscript.workspace = true
celenium-txscript-errors = { workspace = true, features = ["std"] }
celenium-utils = { workspace = true, features = ["sim"] }
log.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
rayon.workspace = true
rocksdb.workspace = true
secp256k1 = { workspace = true, features = ["std", "global-context", "rand-std", "serde"] }
serde.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tokio.workspace = true

rand = { workspace = true, features = ["small_rng"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[dev-dependencies]
criterion.workspace = true
serde_json.workspace = true
flate2.workspace = true
rand_distr.workspace = true
celenium-txscript-errors = { workspace = true, features = ["std"] }
celenium-addresses.workspace = true

[[bench]]
name = "parallel_muhash"
harness = false

[[bench]]
name = "check_scripts"
harness = false

[features]
html_reports = []
devnet-prealloc = ["celenium-consensus-core/devnet-prealloc"]
test-smt-pruning-diagnostics = ["celenium-smt-store/test-smt-pruning-diagnostics"]

[lints]
workspace = true
