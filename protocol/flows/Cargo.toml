[package]
name = "celenium-p2p-flows"
description = "Celenium p2p flows"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
celenium-core.workspace = true
celenium-consensus-core.workspace = true
celenium-consensus-notify.workspace = true
celenium-p2p-lib.workspace = true
celenium-p2p-mining.workspace = true
celenium-utils = { workspace = true, features = ["fd_budget"]}
celenium-utils-tower.workspace = true
celenium-hashes.workspace = true
celenium-muhash = { workspace = true, features = ["std"] }
celenium-seq-commit.workspace = true
celenium-smt.workspace = true
celenium-connectionmanager.workspace = true
celenium-addressmanager.workspace = true
celenium-consensusmanager.workspace = true
celenium-mining.workspace = true
celenium-notify.workspace = true

async-trait.workspace = true
futures = { workspace = true, features = ["alloc"] }
indexmap.workspace = true
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
prost.workspace = true
rand.workspace = true
regex.workspace = true
semver.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tokio-stream = { workspace = true, features = ["net"] }
uuid = { workspace = true, features = ["v4", "fast-rng"] }
chrono.workspace = true

[features]
# Lowers `SMT_CHUNK_SIZE` and `SMT_FLOW_CONTROL_WINDOW` to tiny values so
# integration tests can exercise the chunked / flow-controlled SMT IBD path
# without generating tens of thousands of active lanes.
test-smt-small-chunks = []

[lints]
workspace = true
