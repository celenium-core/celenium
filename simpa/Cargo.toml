[package]
name = "simpa"
description = "Celenium Network Simulator"
publish = false
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
celenium-alloc.workspace = true            # This changes the global allocator for all of the next dependencies so should be kept first
celenium-consensus-core.workspace = true
celenium-consensus-notify.workspace = true
celenium-consensus.workspace = true
celenium-core.workspace = true
celenium-database.workspace = true
celenium-hashes.workspace = true
celenium-perf-monitor.workspace = true
celenium-utils.workspace = true

async-channel.workspace = true
cfg-if.workspace = true
clap.workspace = true
dhat = { workspace = true, optional = true }
futures-util.workspace = true
futures.workspace = true
flate2.workspace = true
indexmap.workspace = true
itertools.workspace = true
log.workspace = true
num_cpus.workspace = true
rand_distr.workspace = true
rand.workspace = true
rayon.workspace = true
secp256k1 = { workspace = true, features = ["std", "global-context", "rand-std", "serde"] }
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }
serde_json.workspace = true
serde.workspace = true
faster-hex.workspace = true
celenium-testing-integration.workspace = true

[dev-dependencies]
celenium-consensus = { workspace = true, features = ["test-smt-pruning-diagnostics"] }
celenium-smt-store = { workspace = true, features = ["test-smt-pruning-diagnostics"] }

[features]
heap = ["dhat", "celenium-alloc/heap"]
semaphore-trace = ["celenium-utils/semaphore-trace"]

[lints]
workspace = true
