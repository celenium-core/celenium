[package]
name = "celenium-testing-integration"
publish = false
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
celenium-alloc.workspace = true            # This changes the global allocator for all of the next dependencies so should be kept first

celenium-addresses.workspace = true
celenium-bip32.workspace = true
celenium-consensus-core.workspace = true
celenium-consensus-notify.workspace = true
celenium-consensus.workspace = true
celenium-consensusmanager.workspace = true
celenium-core.workspace = true
celenium-database.workspace = true
celenium-grpc-client.workspace = true
celenium-grpc-core.workspace = true
celenium-grpc-server.workspace = true
celenium-hashes = { workspace = true, default-features = true }
celenium-index-processor.workspace = true
celenium-math = { workspace = true, features = ["std"] }
celenium-merkle.workspace = true
celenium-muhash = { workspace = true, features = ["std"] }
celenium-notify.workspace = true
celenium-pow.workspace = true
celenium-rpc-core.workspace = true
celenium-rpc-service.workspace = true
celenium-seq-commit.workspace = true
celenium-smt.workspace = true
celenium-txscript.workspace = true
celenium-utils = { workspace = true, default-features = true }
celenium-utxoindex.workspace = true
celenium-wrpc-client.workspace = true
celenium-wrpc-server.workspace = true
celeniumd.workspace = true

async-channel.workspace = true
async-trait.workspace = true
bincode.workspace = true
clap.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
dhat = { workspace = true, optional = true }
faster-hex.workspace = true
flate2.workspace = true
futures-util.workspace = true
indexmap.workspace = true
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
rand_distr.workspace = true
rand.workspace = true
rayon.workspace = true
rocksdb.workspace = true
secp256k1 = { workspace = true, features = ["std", "global-context", "rand-std", "serde"] }
serde_json.workspace = true
serde.workspace = true
smallvec.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
workflow-perf-monitor.workspace = true

[dev-dependencies]
criterion.workspace = true
rand = { workspace = true, features = ["small_rng"] }
tokio = { workspace = true, features = ["rt", "macros", "process"] }
celenium-txscript-errors = { workspace = true, features = ["std"] }
# Enable the small-chunk feature only in test builds so integration tests can
# exercise the SMT chunk / flow-control path without requiring thousands of lanes.
celenium-p2p-flows = { workspace = true, features = ["test-smt-small-chunks"] }

[features]
heap = ["dhat"]
html_reports = []
devnet-prealloc = ["celeniumd/devnet-prealloc"]

[lints]
workspace = true
