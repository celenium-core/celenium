[package]
name = "celenium-wallet-pskt"
keywords = ["celenium", "wallet", "pskt", "psbt", "bip-370"]
description = "Partially Signed Celenium Transaction"
categories = ["cryptography::cryptocurrencies"]
rust-version.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
include.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
wasm32-sdk = ["celenium-consensus-client/wasm32-sdk"]
wasm32-types = ["celenium-consensus-client/wasm32-types"]

[dependencies]
celenium-addresses.workspace = true
celenium-bip32.workspace = true
celenium-consensus-client.workspace = true
celenium-consensus-core.workspace = true
celenium-txscript-errors = { workspace = true, features = ["std"] }
celenium-txscript.workspace = true
celenium-utils.workspace = true

bincode.workspace = true
derive_builder.workspace = true
js-sys.workspace = true
futures.workspace = true
hex.workspace = true
secp256k1 = { workspace = true, features = ["std", "global-context", "rand-std", "serde"] }
serde_repr.workspace = true
serde-value.workspace = true
serde.workspace = true
thiserror.workspace = true
wasm-bindgen.workspace = true
serde_json.workspace = true
serde-wasm-bindgen.workspace = true
workflow-wasm.workspace = true
separator.workspace = true

[dev-dependencies]
serde_json.workspace = true
wasm-bindgen-test.workspace = true
js-sys.workspace = true
web-sys.workspace = true

[lints]
workspace = true
